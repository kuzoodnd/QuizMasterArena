<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Result - QuizMaster Arena</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="result-container">

        <h1>Quiz Completed! 🎉</h1>

        <h2>Your Score</h2>

        <p class="score">
            {{ score }} / {{ total }}
        </p>

        {% if score == total %}
            <p>Perfect score! 🏆</p>
        {% elif score >= total / 2 %}
            <p>Good job! Keep it up! 👍</p>
        {% else %}
            <p>Nice try! You can do better next time! 💪</p>
        {% endif %}

        <br>

        <a href="/categories">
            <button>Take Another Quiz</button>
        </a>

        <br><br>

        <a href="/dashboard">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
